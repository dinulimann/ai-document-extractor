services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: extractor
      POSTGRES_PASSWORD: extractor
      POSTGRES_DB: extractor
    ports:
      - "5546:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extractor"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
